[package]
name = "octane-fmt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
globset = "0.4.16"
ignore = "0.4.25"
# The OXC crates below must share the revision `oxc_adapter` pins (OXC_REVISION
# = 5a6e37e5cf895143a5b34050c50109c46e2ae96a); mixing a second copy produces
# incompatible allocator and AST types.
json-strip-comments = "3.1.1"
oxc_adapter = { git = "https://github.com/tsrx-org/oxc", rev = "5487f8f11625dbfa8f62e7f17ab22cfe44d18600", default-features = false, features = ["toolchain", "parser"] }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "5a6e37e5cf895143a5b34050c50109c46e2ae96a" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", rev = "5a6e37e5cf895143a5b34050c50109c46e2ae96a" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", rev = "5a6e37e5cf895143a5b34050c50109c46e2ae96a" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", rev = "5a6e37e5cf895143a5b34050c50109c46e2ae96a" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "5a6e37e5cf895143a5b34050c50109c46e2ae96a" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tsrx_lint = { git = "https://github.com/tsrx-org/oxc", rev = "5487f8f11625dbfa8f62e7f17ab22cfe44d18600" }
tsrx_parser_engine = { git = "https://github.com/tsrx-org/oxc", rev = "5487f8f11625dbfa8f62e7f17ab22cfe44d18600" }
tsrx_syntax = { git = "https://github.com/tsrx-org/oxc", rev = "5487f8f11625dbfa8f62e7f17ab22cfe44d18600" }
tsrx_tape_schema = { git = "https://github.com/tsrx-org/oxc", rev = "5487f8f11625dbfa8f62e7f17ab22cfe44d18600" }

[lints]
workspace = true
