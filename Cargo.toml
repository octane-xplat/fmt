[workspace]
resolver = "2"
members = ["crates/core", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/octane-xplat/fmt"

[workspace.lints.clippy]
all = "warn"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
