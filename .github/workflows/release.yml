name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, pkg: linux-x64-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, pkg: linux-arm64-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, pkg: linux-arm64-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, pkg: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # aarch64 musl has no apt cross-gcc — cargo-zigbuild supplies it.
      - run: pnpm exec napi build --release -p octane-fmt-node --target ${{ matrix.target }} ${{ matrix.zig && '--cross-compile' || '' }}
      - name: stage platform package
        # napi emits e.g. octane-fmt.win32-x64-msvc.node; normalize to the
        # name the package manifest and loader expect.
        shell: bash
        run: cp crates/node/octane-fmt.node "npm/${{ matrix.pkg }}/octane-fmt.${{ matrix.pkg }}.node"
      - uses: actions/upload-artifact@v4
        with:
          name: fmt-${{ matrix.pkg }}
          # Upload the npm/ subtree — only this job's pkg dir exists here,
          # so the artifact carries npm/<pkg>/… paths for the merge below.
          path: npm/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: fmt-*
          path: npm
          merge-multiple: true
      - name: tag must match package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}" || \
            { echo "tag ${{ github.ref_name }} != package version $(node -p 'require("./package.json").version')"; exit 1; }
      # Artifacts land merged at npm/<pkg>/… because each uploaded its dir.
      - run: pnpm install --frozen-lockfile
      - name: publish platform packages
        run: |
          for dir in npm/*/; do
            (cd "$dir" && pnpm publish --access public --provenance --no-git-checks)
          done
      - name: publish main package
        run: pnpm publish --access public --provenance --no-git-checks
