name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    if: >-
      github.repository == 'octane-xplat/fmt' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - name: Find the qualified revision
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$EVENT_SHA" ]; then
            sha="$EVENT_SHA"
          else
            query="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
            sha="$(gh api "$query" --jq '.workflow_runs[0].head_sha // empty')"
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo '::error::Current main has not passed CI; wait for CI before dispatching stable.'
              exit 1
            fi
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve publication or resume
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.ci.outputs.sha }}
        run: node scripts/release.mjs gate "$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, pkg: linux-x64-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, pkg: linux-arm64-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, pkg: linux-arm64-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, pkg: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # aarch64 musl has no apt cross-gcc — cargo-zigbuild supplies it.
      - run: pnpm exec napi build --release -p octane-fmt-node --target ${{ matrix.target }} ${{ matrix.zig && '--cross-compile' || '' }}
      - name: stage platform package
        # napi emits e.g. octane-fmt.win32-x64-msvc.node; normalize to the
        # name the package manifest and loader expect.
        shell: bash
        run: cp crates/node/octane-fmt.node "npm/${{ matrix.pkg }}/octane-fmt.${{ matrix.pkg }}.node"
      - uses: actions/upload-artifact@v4
        with:
          name: fmt-${{ matrix.pkg }}
          path: npm/${{ matrix.pkg }}/*.node
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      DIST_TAG: ${{ needs.gate.outputs.dist_tag }}
      TESTED_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Require release credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: test -n "$RELEASE_TOKEN" || { echo '::error::Configure RELEASE_TOKEN; see RELEASING.md'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: fmt-*
          path: artifacts
      - name: Stage all native binaries
        run: |
          for dir in npm/*/; do
            platform="$(basename "$dir")"
            cp "artifacts/fmt-$platform/octane-fmt.$platform.node" "$dir"
          done
      - name: Tag the qualified stable revision
        run: |
          set -euo pipefail
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" = "$VERSION"
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$TESTED_SHA"
          else
            git tag "$TAG" "$TESTED_SHA"
            git push origin "$TAG"
          fi
      - name: Publish platform packages, then main (skip existing versions)
        run: node scripts/release.mjs publish "$DIST_TAG"
      - name: Complete stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release.mjs preview "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The PR has consumed pending notes; link the committed logs.
          printf '\n[Changelog](https://github.com/%s/blob/%s/CHANGELOG.md) · [Fixlog](https://github.com/%s/blob/%s/FIXLOG.md)\n' "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_REPOSITORY" "$TAG" >> "$RUNNER_TEMP/notes.md"
          args=()
          if [ "$DIST_TAG" = next ]; then args+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
          gh workflow run release-pr.yml --ref main
